<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reader</title>
<style>
:root { --bg:#0d0d12; --panel:#171722; --fg:#e8e8ed; --muted:#8a8fa8; --accent:#7aa2f7; --accent2:#9ece6a; --border:rgba(255,255,255,.12); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.7 Georgia, 'Times New Roman', serif; }
.wrap { max-width: 740px; margin: 0 auto; padding: 48px 28px 80px; }
.tools { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 10px 0 14px; background: var(--bg); font: 13px system-ui, sans-serif; border-bottom: 1px solid var(--border); margin-bottom: 26px; z-index: 2; }
.tools button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); }
.tools button.ai { border-color: var(--accent2); color: var(--accent2); font-weight: 700; }
.tools .sp { flex: 1; }
.tools .src { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 260px; }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.5px; }
.by { font: 13px system-ui, sans-serif; color: var(--muted); margin-bottom: 28px; }
.sum { font: 15px/1.6 system-ui, sans-serif; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent2); border-radius: 12px; padding: 16px 18px; margin: 0 0 30px; white-space: pre-wrap; }
.sum b { color: var(--accent2); display: block; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
article img { max-width: 100%; height: auto; border-radius: 10px; }
article a { color: var(--accent); }
article pre { font-size: 14px; background: var(--panel); padding: 14px; border-radius: 10px; overflow-x: auto; }
article code { font-size: .9em; }
article figure { margin: 20px 0; }
article h2, article h3 { line-height: 1.3; margin-top: 1.6em; }
article blockquote { border-left: 3px solid var(--accent); margin: 0; padding-left: 16px; color: var(--muted); }
.err { color: var(--muted); font: 15px system-ui, sans-serif; }
body.sans { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tools">
    <button id="ai" class="ai" title="Summarize this page">✦ Summarize</button>
    <button id="font">Aa</button>
    <button id="small">A−</button><button id="big">A+</button>
    <span class="sp"></span>
    <span class="src" id="src"></span>
  </div>
  <h1 id="t">Loading…</h1>
  <div class="by" id="by"></div>
  <div class="sum" id="sum" hidden></div>
  <article id="a"></article>
</div>
<script>
const P = window.obPage, $ = (s) => document.querySelector(s);
const url = decodeURIComponent(location.hash.slice(1));
let size = 18, text = '';
$('#src').textContent = url; $('#src').title = url;
$('#font').onclick = () => document.body.classList.toggle('sans');
$('#small').onclick = () => { size = Math.max(14, size - 1); document.body.style.fontSize = size + 'px'; };
$('#big').onclick = () => { size = Math.min(26, size + 1); document.body.style.fontSize = size + 'px'; };

// Lightweight readability: pick the densest text container, strip chrome.
function extract(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,noscript,iframe,nav,header,footer,aside,form,svg,[role=navigation],[role=banner],[aria-hidden=true],.ad,.ads,.sidebar,.comments,.share,.newsletter,.cookie').forEach((e) => e.remove());
  const title = (doc.querySelector('meta[property="og:title"]') || {}).content || (doc.querySelector('h1') || {}).textContent || doc.title || url;
  const by = (doc.querySelector('meta[name=author]') || doc.querySelector('meta[property="article:author"]') || {}).content || '';
  const date = (doc.querySelector('meta[property="article:published_time"]') || doc.querySelector('time') || {}).content || (doc.querySelector('time') || {}).textContent || '';
  const cands = [...doc.querySelectorAll('article,main,[role=main],.post,.entry-content,.article-body,#content,.content,body')];
  let best = doc.body, bestScore = 0;
  for (const c of cands) { const ps = [...c.querySelectorAll('p')]; const score = ps.reduce((n, p) => n + Math.min(p.textContent.trim().length, 600), 0) - [...c.querySelectorAll('a')].length * 20; if (score > bestScore) { best = c; bestScore = score; } }
  best.querySelectorAll('[style]').forEach((e) => e.removeAttribute('style'));
  best.querySelectorAll('img[data-src]').forEach((e) => (e.src = e.dataset.src));
  best.querySelectorAll('img[src],a[href]').forEach((e) => { try { const k = e.tagName === 'IMG' ? 'src' : 'href'; e.setAttribute(k, new URL(e.getAttribute(k), url).href); } catch (_) {} });
  best.querySelectorAll('p,li,h1,h2,h3,h4,br,div,td').forEach((e) => e.append(' '));
  return { title: title.trim(), by: [by, date].filter(Boolean).join(' · '), html: best.innerHTML, text: best.textContent.replace(/\s+/g, ' ').trim() };
}
// Built-in extractive summary: top sentences by keyword weight, kept in document order.
function quickSummary(t) {
  const sents = t.match(/[^.!?]+[.!?]+/g) || [t];
  const stop = new Set('the a an and or of to in on for with is are was were be by as at it this that from which not have has had but they their you your we our its into than then there here also can will'.split(' '));
  const freq = {}; for (const w of t.toLowerCase().match(/[a-z][a-z'-]{2,}/g) || []) if (!stop.has(w)) freq[w] = (freq[w] || 0) + 1;
  const scored = sents.map((s, i) => ({ s: s.trim(), i, v: (s.toLowerCase().match(/[a-z][a-z'-]{2,}/g) || []).reduce((n, w) => n + (freq[w] || 0), 0) / Math.max(8, s.length / 6) })).filter((x) => x.s.length > 40 && x.s.length < 400);
  return scored.sort((a, b) => b.v - a.v).slice(0, 4).sort((a, b) => a.i - b.i).map((x) => '• ' + x.s).join('\n');
}
$('#ai').onclick = async () => {
  const box = $('#sum'); box.hidden = false; box.innerHTML = '<b>Summary</b>Thinking…';
  const st = await P.aiStatus();
  if (st.ok && st.models.length) {
    const model = st.models.find((m) => /llama|qwen|mistral|gemma|phi/i.test(m)) || st.models[0];
    try { const out = await P.aiSummarize(text, model); box.innerHTML = '<b>Summary · local AI (' + model.replace(/:latest$/, '') + ')</b>'; box.appendChild(document.createTextNode(out.trim())); return; } catch (e) { /* fall through */ }
  }
  box.innerHTML = '<b>Summary · key sentences</b>'; box.appendChild(document.createTextNode(quickSummary(text)));
  if (!st.ok) { const b = document.createElement('button'); b.textContent = 'Install local AI for smarter summaries (Ollama, runs on this computer)'; b.style.cssText = 'margin-top:12px;font:12px system-ui;color:var(--accent2);background:transparent;border:1px solid var(--accent2);border-radius:999px;padding:5px 12px;cursor:pointer'; b.onclick = () => P.aiInstall(); box.appendChild(document.createElement('br')); box.appendChild(b); }
};
(async () => {
  const d = await P.data(); const t = d.theme;
  if (t && t.background) { const r = document.documentElement.style; r.setProperty('--bg', t.background); r.setProperty('--panel', t.lighter_background || t.background); r.setProperty('--fg', t.foreground || '#e8e8ed'); r.setProperty('--muted', t.muted || '#8a8fa8'); r.setProperty('--accent', t.accent || t.blue || '#7aa2f7'); r.setProperty('--accent2', t.green || '#9ece6a'); }
  try {
    const html = (await P.readerHtml(url)) || (await P.fetch(url)); const r = extract(html);
    document.title = r.title; $('#t').textContent = r.title; $('#by').textContent = r.by; $('#a').innerHTML = r.html; text = r.text;
    $('#a').querySelectorAll('a').forEach((a) => (a.onclick = (e) => { e.preventDefault(); P.open(a.href); }));
  } catch (e) { $('#t').textContent = 'Reader view is not available for this page'; $('#a').innerHTML = '<p class="err">' + e.message + '</p>'; }
})();
</script>
</body>
</html>
