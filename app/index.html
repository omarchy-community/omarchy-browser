<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Omarchy Browser</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="brand" title="Omarchy Browser"><img src="icons/32x32.png" alt=""></div>
  <div class="tabs" id="tabs"></div>
  <button class="tab-new" id="tab-new" title="New tab (Ctrl+T)">+</button>
  <div class="drag"></div>
  <div class="winctl">
    <button id="w-min" title="Minimize">&#8211;</button>
    <button id="w-max" title="Maximize">&#9633;</button>
    <button id="w-close" class="close" title="Close">&#10005;</button>
  </div>
</header>
<nav class="nav">
  <button id="back" title="Back (Alt+Left)">&#8592;</button>
  <button id="fwd" title="Forward (Alt+Right)">&#8594;</button>
  <button id="reload" title="Reload (Ctrl+R)">&#8635;</button>
  <form class="omni" id="omni"><input id="url" spellcheck="false" autocomplete="off" placeholder="Search the web or type an address"></form>
  <button id="store-toggle" class="store-btn" title="Omarchy Store (Ctrl+B)"><img src="icons/store-64.png" alt="">Store</button>
</nav>
<div class="body">
  <main class="pages" id="pages"></main>
  <aside class="store" id="store" hidden>
    <div class="store-head">
      <div class="store-title"><img src="icons/store-64.png" alt=""><div><b>Omarchy Store</b><span>The world's largest app store for Omarchy</span></div></div>
      <input id="store-q" type="search" placeholder="Search apps" spellcheck="false">
      <div class="cats" id="cats"></div>
    </div>
    <div class="store-list" id="store-list"><div class="muted pad">Loading the store…</div></div>
    <div class="store-detail" id="store-detail" hidden></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
