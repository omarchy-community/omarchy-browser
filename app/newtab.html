<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 600px at 50% -10%, #24305a 0%, #0d0d12 60%); color: #e8e8ed; font-family: system-ui, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 40px; box-sizing: border-box; }
  img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 18px 60px rgba(122,162,247,.35); }
  h1 { margin: 0; font-size: 34px; letter-spacing: -.5px; }
  p { margin: 0; color: #9aa0b8; }
  form { width: min(640px, 90vw); }
  input { width: 100%; box-sizing: border-box; padding: 16px 22px; font-size: 16px; border-radius: 999px; border: 1px solid #2f3550; background: rgba(20,20,30,.85); color: #e8e8ed; outline: none; }
  input:focus { border-color: #7aa2f7; box-shadow: 0 0 0 4px rgba(122,162,247,.2); }
  .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  a { color: #c0caf5; text-decoration: none; padding: 10px 16px; border: 1px solid #2f3550; border-radius: 12px; background: rgba(20,20,30,.6); }
  a:hover { border-color: #7aa2f7; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <img src="icons/256x256.png" alt="">
  <h1>Omarchy Browser</h1>
  <p>The web, with the Omarchy Store one click away.</p>
  <form action="https://duckduckgo.com/" method="get"><input name="q" autofocus placeholder="Search the web" autocomplete="off"></form>
  <div class="links">
    <a href="https://omarchystore.com/">Omarchy Store</a>
    <a href="https://omarchy.org/">Omarchy</a>
    <a href="https://github.com/">GitHub</a>
    <a href="https://www.reddit.com/r/omarchy/">r/omarchy</a>
  </div>
</div>
</body>
</html>
